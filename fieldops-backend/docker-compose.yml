services:
  postgres:
    image: postgres:16
    container_name: fieldops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fieldops
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - fieldops_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: fieldops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - fieldops_redis_data:/data

volumes:
  fieldops_postgres_data:
  fieldops_redis_data:
